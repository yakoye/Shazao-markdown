name: 问题反馈
description: 报告使用中遇到的问题，选一个版本并简单描述发生了什么。
body:
  - type: dropdown
    id: version
    attributes:
      label: 当前使用的版本号
      description: 请在「帮助 → 关于 Shazao」中查看并选择当前使用的版本号。
      options:
        # BEGIN RELEASE OPTIONS
        - v0.7.2
        - v0.6.26
        - v0.6.24
        # END RELEASE OPTIONS
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - macOS Golden Gate 27
        - macOS Tahoe 26
        - macOS Sequoia 15
        - macOS Sonoma 14
        - macOS Ventura 13
        - Ubuntu 26
        - Ubuntu 24
        - Ubuntu 22
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 可以附截图，也可以补充系统详细版本或下载渠道。
      placeholder: 你做了什么？发生了什么？你希望怎样？
    validations:
      required: true
