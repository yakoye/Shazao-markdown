name: 问题反馈
description: 报告使用中遇到的问题，选一个版本并简单描述发生了什么。
labels: [bug]
body:
  - type: dropdown
    id: version
    attributes:
      label: 当前版本号
      description: 在「帮助 → 关于 Shazao」中查看。打不开程序或记不清时，可以选「不确定」。
      options:
        # BEGIN RELEASE OPTIONS
        - v0.6.19
        - v0.6.18
        - v0.6.17
        # END RELEASE OPTIONS
        - 旧版或其他版本
        - 不确定
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Ubuntu
        - 其他 Linux
        - 其他
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 可以附截图。知道具体旧版版本号、系统版本或下载渠道的话，也可以写在这里。
      placeholder: 你做了什么？发生了什么？你希望怎样？
    validations:
      required: true
