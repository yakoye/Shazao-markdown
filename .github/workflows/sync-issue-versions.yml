name: 同步问题反馈版本

on:
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: issue-version-options
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: 从 Releases 同步版本
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            python3 .github/scripts/sync_issue_versions.py

          form=.github/ISSUE_TEMPLATE/bug_report.yml
          if git diff --quiet -- "$form"; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$form"
          git commit -m '同步问题反馈的发布版本选项'
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
